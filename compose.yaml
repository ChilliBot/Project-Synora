services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synora
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: synora
    ports:
      - "5432:5432"
    volumes:
      - synora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora -d synora"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: synora
      MINIO_ROOT_PASSWORD: change-me-locally
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - synora-minio:/data

volumes:
  synora-postgres:
  synora-minio:
